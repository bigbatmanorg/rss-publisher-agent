[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:publisher-api]
command=/usr/local/bin/rss-publisher-api
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:publisher-mcp]
command=/usr/local/bin/rss-publisher-mcp
environment=RSS_MCP_TRANSPORT="streamable-http"
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:runtime-helper]
command=python /app/scripts/appliance_runtime.py
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=15

[program:agent-mcp]
command=/usr/local/bin/docker-agent serve mcp /app/agent.yaml --agent root --tool-name rss_publisher --http --listen 127.0.0.1:8081 --safety autonomous
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:agent-a2a]
command=/usr/local/bin/docker-agent serve a2a /app/agent.yaml --agent root --listen 127.0.0.1:8082 --session-db /data/agent-a2a.db --safety autonomous
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:agent-chat]
command=/usr/local/bin/docker-agent serve chat /app/agent.yaml --agent root --listen 127.0.0.1:8083 --safety autonomous --max-request-size 1048576
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:caddy]
command=/usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=50
